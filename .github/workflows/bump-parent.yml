name: Bump parent submodule pointer

on:
  push:
    branches: [main]

jobs:
  bump-parent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout parent repo
        uses: actions/checkout@v4
        with:
          repository: Dinidu21/backend-platform
          token: ${{ secrets.PARENT_PAT }}
          fetch-depth: 0
          submodules: true

      - name: Update submodule pointer to latest main
        run: |
          git -C "config-server" fetch origin main
          git -C "config-server" checkout origin/main

      - name: Open PR against parent
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PARENT_PAT }}
          commit-message: "chore: bump config-server submodule"
          branch: "bump/config-server"
          title: "chore: bump config-server submodule"
          body: |
            Automated submodule pointer bump.

            Source repository: Dinidu21/config-server
            Parent repository: Dinidu21/backend-platform
            Triggered by push to config-server/main.

          delete-branch: true
